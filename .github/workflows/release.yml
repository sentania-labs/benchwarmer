name: release

# A tag vX.Y.Z on main publishes the release (ADR 0012): the MSI, the
# by-hand zip, and SHA256SUMS. Nothing is published until both install
# routes have passed the smoke test on a clean Windows runner.
#
# Split across runners on purpose: Linux builds the binaries, fetches and
# verifies the llama.cpp runtime, and zips the file set with the same
# `make package` target CI and developers use; Windows builds the MSI from
# that exact zip (WiX and msiexec need Windows) and smoke-tests it. The MSI
# and the zip therefore cannot drift apart.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse a bad tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $GITHUB_REF_NAME"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check
        run: make check VERSION="$GITHUB_REF_NAME"
      - name: Package
        run: make package VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: dist/benchwarmer-${{ github.ref_name }}-windows-amd64.zip
          if-no-files-found: error

  msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: dist
      - name: Unpack zip
        shell: pwsh
        run: |
          Expand-Archive "dist\benchwarmer-$env:GITHUB_REF_NAME-windows-amd64.zip" -DestinationPath dist\zip
          "PKG_DIR=$((Resolve-Path "dist\zip\benchwarmer-$env:GITHUB_REF_NAME-windows-amd64").Path)" >> $env:GITHUB_ENV
          "MSI_VERSION=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_ENV
      - name: Build MSI
        shell: pwsh
        run: .\packaging\build-msi.ps1 -StageDir $env:PKG_DIR -OutDir dist -Version $env:MSI_VERSION
      - name: Smoke test MSI (install, verify, uninstall)
        shell: pwsh
        run: .\packaging\smoke.ps1 -Mode msi -Path "dist\benchwarmer-$env:MSI_VERSION-x64.msi" -LogDir logs\msi
      - name: Smoke test zip (install.ps1, uninstall.ps1)
        shell: pwsh
        run: .\packaging\smoke.ps1 -Mode zip -Path $env:PKG_DIR -LogDir logs\zip
      - name: Collect service logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs\service | Out-Null
          Copy-Item -Recurse -ErrorAction SilentlyContinue C:\ProgramData\Benchwarmer\logs\* logs\service\
          Get-WinEvent -LogName System -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -eq 'Service Control Manager' } |
            Format-List TimeCreated, Id, Message | Out-File logs\service\scm.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: msi-logs
          path: logs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-msi
          path: dist/benchwarmer-*-x64.msi
          if-no-files-found: error

  publish:
    needs: [build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Checksums and notes
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          N="${V#v}"
          cd out
          test -f "benchwarmer-$N-x64.msi"
          test -f "benchwarmer-$V-windows-amd64.zip"
          sha256sum "benchwarmer-$N-x64.msi" "benchwarmer-$V-windows-amd64.zip" > SHA256SUMS
          cat SHA256SUMS
          cat > notes.md <<EOF
          Benchwarmer $V for Windows x64.

          **Install:** see [docs/deploy/install.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$V/docs/deploy/install.md) for prerequisites (Defender ASR exclusion, GPU driver, firewall and certificate for LAN access) and first-run setup.

          - **MSI** (recommended, and the one to use with Group Policy): \`benchwarmer-$N-x64.msi\`. From an elevated prompt run \`msiexec /i benchwarmer-$N-x64.msi /qn /norestart\`, or assign it to computers with GPO Software Installation. A newer MSI upgrades an older one in place.
          - **By hand:** unzip \`benchwarmer-$V-windows-amd64.zip\` and run \`.\\install.ps1\` from an elevated PowerShell in that folder.

          Use one route per machine. After installing, copy a GGUF model to \`C:\\ProgramData\\Benchwarmer\\models\\\` and choose it in the dashboard (http://127.0.0.1:8481/).

          Unsigned: verify downloads against \`SHA256SUMS\`.
          EOF
      - name: Publish (idempotent per tag, never replaces assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          N="${V#v}"
          cd out
          files=("benchwarmer-$N-x64.msi" "benchwarmer-$V-windows-amd64.zip" SHA256SUMS)
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run only fills in missing assets. Published files are never
            # replaced: anyone who downloaded them holds their SHA256SUMS.
            have=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            missing=()
            for f in "${files[@]}"; do grep -qxF "$f" <<<"$have" || missing+=("$f"); done
            if [ "${#missing[@]}" -gt 0 ] && [ "${#missing[@]}" -lt "${#files[@]}" ]; then
              echo "release $V is partly published; this build's files would not match SHA256SUMS. Fix it by hand." >&2
              exit 1
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$V" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$V" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$V" "${files[@]}" --title "$V" --notes-file notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
