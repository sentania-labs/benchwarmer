openapi: 3.1.0
info:
  title: Benchwarmer management API
  version: "1"
  summary: Management API for the Benchwarmer opportunistic GPU worker.
  description: |
    The management listener (`listen.management`, loopback by default) serves
    `/api/v1/*` and `/metrics`. The inference listener (`listen.inference`)
    serves the OpenAI-compatible `/v1/*` proxy; its availability contract is
    documented under the `/v1/{path}` operation below.

    Times are RFC 3339 with an offset. Clients render them in local time.
    Fields whose names end in `_ns` are nanoseconds; `_ms` are milliseconds.

    ## Authentication (ADR 0007)

    Bearer tokens in `Authorization: Bearer <token>`. There are three
    independent tokens, each stored in its own file under the data
    directory's `secrets` folder:

    | Token | Accepted on |
    |---|---|
    | management | every management endpoint |
    | agent | `GET /api/v1/status`, `GET /api/v1/health`, `PUT /api/v1/mode`, `POST /api/v1/agent/report` |
    | inference | the inference proxy only; refused (403) on the management API |

    The agent token is readable by interactive users so the tray and session
    agent work for a non-administrator; it cannot read or change config,
    applications, or events, drain, reload, or read metrics.

    Tokenless access: when `security.loopback_trust` is true, `GET`
    endpoints (including `/metrics`) are allowed without a token if the TCP
    peer is a loopback address **and** the `Host` header names `localhost` or
    a loopback IP (a DNS-rebinding defence). Loopback is determined from the
    TCP connection only; `X-Forwarded-For` and similar headers are ignored.
    Every write needs a token regardless of source.

    Results: no token or an unknown token is `401` (with `WWW-Authenticate:
    Bearer`); a valid token that is not accepted on the endpoint is `403`.
    Token values never appear in responses or logs.

    ## Conventions

    Every non-2xx response body is an `Error` with a machine-readable
    `code`. Every response carries `Cache-Control: no-store`. Request bodies
    are limited to 1 MiB for `PUT /api/v1/config` and
    `PUT /api/v1/applications`, 16 KiB otherwise (`413 body_too_large`).
    Config, applications, mode, drain, and reload bodies are decoded
    strictly: unknown fields are rejected with `400 bad_request`. Agent
    reports tolerate unknown fields so a newer agent works with an older
    service.
servers:
  - url: http://127.0.0.1:8481
    description: Management listener (default)
security:
  - bearer: []
  - {}
tags:
  - name: status
    description: Health, status, and the audit event log.
  - name: config
    description: Configuration and application classification rules.
  - name: control
    description: Manual mode, drain, and reload.
  - name: agent
    description: Reports from the per-session agent.
  - name: metrics
    description: Prometheus metrics.
  - name: inference
    description: The OpenAI-compatible proxy on the inference listener.

paths:
  /api/v1/health:
    get:
      tags: [status]
      operationId: getHealth
      summary: Service health (not inference availability).
      description: Loopback trust, management token, or agent token.
      responses:
        "200":
          description: Health report. `ok` is false when any problem is listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatus
      summary: Current condition, state, decision, telemetry, and timers.
      description: Loopback trust, management token, or agent token.
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Active configuration with secrets redacted.
      description: |
        Loopback trust or management token. Secret-looking values in
        `runtime.args` (for example the value after `--api-key`) are
        replaced by `"<redacted>"`.
      responses:
        "200":
          description: Redacted config and where it was loaded from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [config]
      operationId: putConfig
      summary: Replace the configuration.
      description: |
        Management token only. The body is a complete `Config`. Values
        returned as `"<redacted>"` by `GET` may be sent back unchanged and
        keep their stored secret, so a client can round-trip what it read.
        The config is validated, persisted atomically, applied, and audited.
        The response reports whether the change needs a runtime reload or a
        service restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
      responses:
        "200":
          description: Applied. Config is redacted; `impact` is present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResponse" }
        "400": { $ref: "#/components/responses/InvalidConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Rejected" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /api/v1/events:
    get:
      tags: [status]
      operationId: getEvents
      summary: Recent audit events, newest first.
      description: Loopback trust or management token.
      parameters:
        - name: limit
          in: query
          description: Page size. Default 100; values above 1000 are treated as 1000.
          schema: { type: integer, minimum: 1, default: 100 }
        - name: before_id
          in: query
          description: Return only events with a smaller id (use `next_before_id` from the previous page).
          schema: { type: integer, format: int64, minimum: 1 }
        - name: type
          in: query
          description: Event type filter. Repeat the parameter or separate with commas; at most 64 types.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EventType" }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/applications:
    get:
      tags: [config]
      operationId: getApplications
      summary: Application classification rules, in evaluation order.
      description: Loopback trust or management token.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationsBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [config]
      operationId: putApplications
      summary: Replace the application rules.
      description: |
        Management token only. Replaces `applications` in the active config
        and applies it like `PUT /api/v1/config`. `applications` is required;
        send `[]` for none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationsBody" }
      responses:
        "200":
          description: Applied rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationsBody" }
        "400": { $ref: "#/components/responses/InvalidConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Rejected" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /api/v1/mode:
    put:
      tags: [control]
      operationId: putMode
      summary: Set the manual mode (Auto, Pause AI, AI Priority).
      description: |
        Management token or agent token. `duration` is a Go duration string
        (`"30m"`, `"2h"`), empty for indefinite, `"until_reboot"`, or
        `"until_tomorrow"`. `auto` takes no duration. Pause durations are at
        most 720h; AI Priority durations at most `modes.max_ai_priority`.
        `set_by` defaults to `"api"`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeRequest" }
      responses:
        "200":
          description: The mode now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeStatus" }
        "400":
          description: Invalid mode or duration (`invalid_mode`) or malformed body (`bad_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Rejected" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /api/v1/drain:
    post:
      tags: [control]
      operationId: postDrain
      summary: Drain and unload now (manual; not counted toward anti-thrashing).
      description: Management token only. The worker reloads when policy allows.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "202":
          description: Accepted; the controller acts asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Rejected" }

  /api/v1/reload:
    post:
      tags: [control]
      operationId: postReload
      summary: Restart the runtime (drains first).
      description: Management token only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "202":
          description: Accepted; the controller acts asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Rejected" }

  /api/v1/agent/report:
    post:
      tags: [agent]
      operationId: postAgentReport
      summary: Session agent report (foreground app, fullscreen, idle, lock).
      description: Agent token or management token. Unknown fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReport" }
      responses:
        "204":
          description: Recorded.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Prometheus exposition.
      description: |
        Loopback trust or management token. `404 not_found` when
        `metrics.enabled` is false.
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/{path}:
    servers:
      - url: http://127.0.0.1:8480
        description: Inference listener (default)
    parameters:
      - name: path
        in: path
        required: true
        description: Any OpenAI-compatible path, for example `chat/completions`.
        schema: { type: string }
    post:
      tags: [inference]
      operationId: proxyInference
      summary: OpenAI-compatible inference, proxied to llama-server.
      description: |
        Served by the inference listener, not the management listener.
        Requests and streaming responses pass through unmodified while the
        worker is admitting. The inference token is required when
        `security.require_inference_token` is true (optional on loopback).
        Every response carries `X-Benchwarmer-Condition` and
        `X-Benchwarmer-Request-Id`.

        When the worker is not admitting (loading, yielding, cooling down,
        paused, suppressed, or in error) the proxy answers `503` with an
        `Error` whose `code` is `worker_unavailable`, plus the user-visible
        `condition`, a `reason`, and `retry_after` when a retry time is
        known (mirrored in the `Retry-After` header, in seconds). A request
        cut off by preemption or `runtime.max_request_duration` ends early;
        streaming clients see the stream close.
      security:
        - bearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Passed through without interpretation.
      responses:
        "200":
          description: Upstream response, passed through.
          headers:
            X-Benchwarmer-Condition: { $ref: "#/components/headers/Condition" }
            X-Benchwarmer-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "401":
          description: Missing or invalid inference token.
          headers:
            X-Benchwarmer-Condition: { $ref: "#/components/headers/Condition" }
            X-Benchwarmer-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Worker unavailable. `code` is `worker_unavailable`.
          headers:
            X-Benchwarmer-Condition: { $ref: "#/components/headers/Condition" }
            X-Benchwarmer-Request-Id: { $ref: "#/components/headers/RequestId" }
            Retry-After:
              description: Seconds until `retry_after`, when known.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: "worker unavailable: a game is running"
                code: worker_unavailable
                condition: Yielding
                reason: a game is running
                retry_after: "2026-09-23T15:05:00-05:00"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Management, agent, or inference token (see the access table above).

  headers:
    Condition:
      description: User-visible condition at the time of the response.
      schema: { $ref: "#/components/schemas/Condition" }
    RequestId:
      description: Proxy-assigned request id, also recorded in related events.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request (`bad_request`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidConfig:
      description: |
        `invalid_config` with one `details` entry per problem, or
        `bad_request` for malformed JSON or unknown fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: configuration is invalid
            code: invalid_config
            details:
              - field: runtime.host
                message: 'must be a loopback address; the runtime must not be reachable from other machines (got "0.0.0.0")'
    Unauthorized:
      description: No token, or the token is not valid (`unauthorized`, `invalid_token`).
      headers:
        WWW-Authenticate:
          schema: { type: string, const: 'Bearer realm="benchwarmer"' }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: A valid token that this endpoint does not accept (`forbidden`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Rejected:
      description: The service refused the request in its current state (`rejected`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body over the limit (`body_too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such endpoint, or metrics disabled (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # Enumerations.
    State:
      type: string
      enum: [STOPPED, COOLDOWN, LOADING, READY, BUSY, DRAINING, PREEMPTING, SUPPRESSED, DISABLED, ERROR]
    Condition:
      type: string
      enum: [Available, Yielding, Unavailable]
    Mode:
      type: string
      enum: [auto, pause, ai_priority]
    Confidence:
      type: string
      enum: [high, degraded, none]
    Action:
      type: string
      enum: [run, hold, drain, preempt]
    Severity:
      type: string
      enum: [info, notice, warning, critical]
    AppClass:
      type: string
      enum: [game, launcher, ignore, ordinary]
    Duration:
      type: string
      description: Go duration string, for example "15s", "5m0s", "1h30m0s".
      examples: ["15s", "5m0s"]
    EventType:
      type: string
      enum:
        - service_started
        - service_stopping
        - state_changed
        - decision_changed
        - load_started
        - load_completed
        - load_failed
        - drain_started
        - drain_completed
        - grace_shortened
        - preempted
        - runtime_stopped
        - runtime_crashed
        - kill_failed
        - vram_released
        - vram_release_timeout
        - orphan_killed
        - cooldown_started
        - cooldown_reset
        - suppression_started
        - recovery_scheduled
        - mode_changed
        - mode_expired
        - config_changed
        - config_rejected
        - config_recovered
        - telemetry_lost
        - telemetry_recovered
        - telemetry_degraded
        - power_suspend
        - power_resume
        - session_change
        - agent_connected
        - agent_disconnected
        - device_lost
        - requests_rejected
        - request_force_closed
    ErrorCode:
      type: string
      enum:
        - unauthorized
        - invalid_token
        - forbidden
        - not_found
        - method_not_allowed
        - bad_request
        - body_too_large
        - invalid_config
        - invalid_mode
        - internal_error
        - rejected
        - worker_unavailable

    Error:
      type: object
      description: Every non-2xx JSON body, including the inference proxy's 503.
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message. }
        code: { $ref: "#/components/schemas/ErrorCode" }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        condition: { $ref: "#/components/schemas/Condition" }
        reason: { type: string }
        retry_after: { type: string, format: date-time }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: ["runtime.host"] }
        message: { type: string }

    Health:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }
        problems:
          type: array
          items: { type: string }

    Status:
      type: object
      required: [time, version, condition, state, summary, mode, profile, runtime, gpu, decision, timers, agent, config_source]
      properties:
        time: { type: string, format: date-time }
        version: { type: string }
        condition: { $ref: "#/components/schemas/Condition" }
        state: { $ref: "#/components/schemas/State" }
        summary: { type: string, description: One sentence for the tray tooltip and dashboard header. }
        mode: { $ref: "#/components/schemas/ModeStatus" }
        profile: { $ref: "#/components/schemas/ProfileStatus" }
        runtime: { $ref: "#/components/schemas/RuntimeStatus" }
        gpu: { $ref: "#/components/schemas/GPUStatus" }
        decision: { $ref: "#/components/schemas/Decision" }
        timers: { $ref: "#/components/schemas/TimerStatus" }
        agent: { $ref: "#/components/schemas/AgentStatus" }
        trigger: { type: string, description: "Competing application or metric, when known." }
        recent_errors:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        config_source:
          type: string
          enum: [primary, last_good, default]
          description: Anything but primary is a problem the UI must show.
    ModeStatus:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        until: { type: string, format: date-time }
        set_by: { type: string }
        set_at: { type: string, format: date-time }
    ProfileStatus:
      type: object
      required: [active, source, timezone]
      properties:
        active: { type: string }
        source: { type: string, description: '"default", "schedule:<name>", or "ai_priority".' }
        timezone: { type: string }
        next_change: { type: string, format: date-time }
    RuntimeStatus:
      type: object
      required: [ready, model, active_requests, oldest_request_seconds, crash_count]
      properties:
        pid: { type: integer }
        ready: { type: boolean }
        model: { type: string, description: Model file name only. }
        active_requests: { type: integer }
        oldest_request_seconds: { type: number }
        loaded_at: { type: string, format: date-time }
        last_load_seconds: { type: number }
        footprint_mib: { type: integer }
        crash_count: { type: integer }
    GPUStatus:
      type: object
      required: [adapter, confidence, total_util_pct, own_util_pct, external_util_pct, vram_total_mib, vram_used_mib, vram_free_mib, own_vram_mib, external_vram_mib]
      properties:
        adapter: { type: string }
        confidence: { $ref: "#/components/schemas/Confidence" }
        total_util_pct: { type: number }
        own_util_pct: { type: number }
        external_util_pct: { type: number }
        vram_total_mib: { type: integer }
        vram_used_mib: { type: integer }
        vram_free_mib: { type: integer }
        own_vram_mib: { type: integer }
        external_vram_mib: { type: integer }
        temperature_c: { type: number, description: Absent when unknown. }
        top_external:
          type: array
          items: { $ref: "#/components/schemas/AppMatch" }
        sampled_at: { type: string, format: date-time }
    TimerStatus:
      type: object
      properties:
        grace_until: { type: string, format: date-time }
        cooldown_until: { type: string, format: date-time }
        suppressed_until: { type: string, format: date-time }
        recovery_until: { type: string, format: date-time }
        next_load_at: { type: string, format: date-time }
        next_load_reason: { type: string }
    AgentStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        last_report: { type: string, format: date-time }
        session_id: { type: integer, format: uint32 }

    Decision:
      type: object
      required: [action, rule, tier, severity, reason, profile, profile_source, mode, competing, counts_as_preemption, suppress, idle_state]
      properties:
        action: { $ref: "#/components/schemas/Action" }
        rule: { type: string, examples: ["gaming.confirmed"] }
        tier: { type: integer, minimum: 1, maximum: 8, description: Precedence tier; 1 is highest. }
        severity: { $ref: "#/components/schemas/Severity" }
        reason: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        profile: { type: string }
        profile_source: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        grace_ns: { type: integer, format: int64, description: Drain grace in nanoseconds. }
        competing: { type: boolean }
        counts_as_preemption: { type: boolean }
        suppress: { type: boolean }
        idle_state: { $ref: "#/components/schemas/State" }
        next_load_at: { type: string, format: date-time }
        also_matched:
          type: array
          items: { type: string }
    Evidence:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        threshold: { type: string }
        source: { type: string }
    AppMatch:
      type: object
      required: [pid, name, class, rule, gpu_util_pct, vram_mib, foreground, fullscreen, running_for_ns]
      properties:
        pid: { type: integer, format: uint32 }
        name: { type: string }
        path: { type: string }
        class: { $ref: "#/components/schemas/AppClass" }
        rule: { type: string }
        gpu_util_pct: { type: number }
        vram_mib: { type: integer }
        foreground: { type: boolean }
        fullscreen: { type: boolean }
        running_for_ns: { type: integer, format: int64 }
        parent_name: { type: string }

    Event:
      type: object
      description: One audit record. Never contains prompts, bodies, or credentials.
      required: [id, time, type, message]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/EventType" }
        prev_state: { $ref: "#/components/schemas/State" }
        state: { $ref: "#/components/schemas/State" }
        condition: { $ref: "#/components/schemas/Condition" }
        profile: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        rule: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        telemetry: { $ref: "#/components/schemas/EventTelemetry" }
        runtime_pid: { type: integer }
        request_id: { type: string }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
          description: Type-specific measurements (durations as *_ms, deadlines as RFC 3339).
    EventTelemetry:
      type: object
      required: [confidence, total_util_pct, own_util_pct, external_util_pct, vram_used_mib, vram_free_mib, own_vram_mib, external_vram_mib]
      properties:
        confidence: { $ref: "#/components/schemas/Confidence" }
        total_util_pct: { type: number }
        own_util_pct: { type: number }
        external_util_pct: { type: number }
        vram_used_mib: { type: integer }
        vram_free_mib: { type: integer }
        own_vram_mib: { type: integer }
        external_vram_mib: { type: integer }
        temperature_c: { type: number }
    EventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_before_id:
          type: integer
          format: int64
          description: Pass as before_id for the next (older) page; absent when there are no older events.

    ModeRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        duration:
          type: string
          description: Go duration, empty for indefinite, "until_reboot", or "until_tomorrow".
          examples: ["30m", "2h", "until_reboot", "until_tomorrow"]
        set_by: { type: string, maxLength: 64, examples: ["tray", "ui"] }
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 200 }
    ActionResponse:
      type: object
      required: [accepted, action, reason]
      properties:
        accepted: { type: boolean }
        action: { type: string, enum: [drain, reload] }
        reason: { type: string }
    AgentReport:
      type: object
      required: [session_id, fullscreen, idle_seconds, locked]
      properties:
        session_id: { type: integer, format: uint32 }
        foreground_pid: { type: integer, format: uint32 }
        foreground_name: { type: string }
        foreground_path: { type: string }
        fullscreen: { type: boolean }
        notification_state: { type: string }
        idle_seconds: { type: number }
        locked: { type: boolean }

    ConfigResponse:
      type: object
      required: [config, source]
      properties:
        config: { $ref: "#/components/schemas/Config" }
        source: { type: string, enum: [primary, last_good, default] }
        impact: { $ref: "#/components/schemas/Impact" }
    Impact:
      type: object
      required: [changed, runtime_reload, service_restart]
      properties:
        changed:
          type: array
          items: { type: string }
        runtime_reload: { type: boolean }
        service_restart: { type: boolean }
        reload_sections:
          type: array
          items: { type: string }
        restart_sections:
          type: array
          items: { type: string }
    ApplicationsBody:
      type: object
      required: [applications]
      additionalProperties: false
      properties:
        applications:
          type: array
          items: { $ref: "#/components/schemas/AppRule" }

    # Configuration (internal/config). Unknown fields are rejected.
    Config:
      type: object
      additionalProperties: false
      required: [schema_version, runtime, listen, telemetry, safety, contention, profiles, default_profile, ai_priority_profile, schedules, timezone, applications, anti_thrash, recovery, modes, signals, security, retention, metrics, logging]
      properties:
        schema_version: { type: integer, const: 1 }
        runtime: { $ref: "#/components/schemas/RuntimeConfig" }
        listen: { $ref: "#/components/schemas/ListenConfig" }
        telemetry: { $ref: "#/components/schemas/TelemetryConfig" }
        safety: { $ref: "#/components/schemas/SafetyConfig" }
        contention: { $ref: "#/components/schemas/ContentionConfig" }
        profiles:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Profile" }
        default_profile: { type: string }
        ai_priority_profile: { type: string }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }
        timezone: { type: string, examples: ["America/Chicago"] }
        applications:
          type: array
          items: { $ref: "#/components/schemas/AppRule" }
        anti_thrash: { $ref: "#/components/schemas/AntiThrashConfig" }
        recovery: { $ref: "#/components/schemas/RecoveryConfig" }
        modes: { $ref: "#/components/schemas/ModesConfig" }
        signals: { $ref: "#/components/schemas/SignalsConfig" }
        security: { $ref: "#/components/schemas/SecurityConfig" }
        retention: { $ref: "#/components/schemas/RetentionConfig" }
        metrics: { $ref: "#/components/schemas/MetricsConfig" }
        logging: { $ref: "#/components/schemas/LoggingConfig" }
    RuntimeConfig:
      type: object
      additionalProperties: false
      properties:
        executable: { type: string }
        model_path: { type: string }
        args:
          type: array
          items: { type: string }
          description: Extra llama-server arguments. Secret values are redacted on read.
        context_size: { type: integer }
        gpu_layers: { type: integer }
        run_as:
          type: string
          enum: [localservice, service]
          description: Runtime identity. localservice runs llama-server as NT AUTHORITY\LocalService with no privileges; service runs it as the service account.
        host: { type: string, description: Must be a loopback address. }
        port: { type: integer }
        stop_mode:
          type: string
          enum: [graceful, kill]
          description: graceful sends Ctrl+C and hard-kills only after graceful_stop_timeout; kill always hard-kills.
        graceful_stop_timeout: { $ref: "#/components/schemas/Duration" }
        load_timeout: { $ref: "#/components/schemas/Duration" }
        required_free_vram_mib: { type: integer }
        kill_verify_timeout: { $ref: "#/components/schemas/Duration" }
        vram_release_timeout: { $ref: "#/components/schemas/Duration" }
        vram_release_tolerance_mib: { type: integer }
        max_request_duration: { $ref: "#/components/schemas/Duration" }
        diagnostics_tail_bytes: { type: integer }
    ListenConfig:
      type: object
      additionalProperties: false
      properties:
        inference: { type: string, examples: ["127.0.0.1:8480"] }
        management: { type: string, examples: ["127.0.0.1:8481"] }
        inference_tls: { $ref: "#/components/schemas/TLSConfig" }
    TLSConfig:
      type: object
      additionalProperties: false
      description: HTTPS for the inference listener. Required when it is not loopback. Deployments use a CA-issued certificate from the Windows store (store_subject or store_thumbprint) or PEM files; self_signed is for testing.
      properties:
        enabled: { type: boolean }
        cert_file: { type: string, description: PEM chain (leaf first). Relative paths are in the data directory. PFX files are not read; import them into LocalMachine\My. }
        key_file: { type: string, description: PEM private key. }
        pfx_password_file: { type: string, deprecated: true, description: Accepted only so older files parse. Must be empty. }
        store_thumbprint: { type: string, description: Hex SHA-1 thumbprint of a certificate in the Windows LocalMachine\My store. }
        store_subject: { type: string, description: Subject or DNS name to match in LocalMachine\My; the newest valid match with a private key is used. }
        self_signed: { type: boolean }
        self_signed_hosts: { type: array, items: { type: string } }
    TelemetryConfig:
      type: object
      additionalProperties: false
      properties:
        adapter: { type: string }
        sample_interval: { $ref: "#/components/schemas/Duration" }
        loss_grace: { $ref: "#/components/schemas/Duration" }
        degraded_margin_pct: { type: integer }
    SafetyConfig:
      type: object
      additionalProperties: false
      properties:
        gpu_temp_critical_c: { type: number }
        gpu_temp_resume_c: { type: number }
    ContentionConfig:
      type: object
      additionalProperties: false
      properties:
        vram_free_critical_mib: { type: integer }
        external_vram_critical_mib: { type: integer }
        external_util_critical_pct: { type: number }
        critical_window: { $ref: "#/components/schemas/Duration" }
        clear_window: { $ref: "#/components/schemas/Duration" }
    Profile:
      type: object
      additionalProperties: false
      properties:
        description: { type: string }
        grace: { $ref: "#/components/schemas/Duration" }
        grace_under_pressure: { $ref: "#/components/schemas/Duration" }
        cooldown: { $ref: "#/components/schemas/Duration" }
        external_util_soft_pct: { type: number }
        soft_window: { $ref: "#/components/schemas/Duration" }
        external_vram_soft_mib: { type: integer }
        drain_on_game_process: { type: boolean }
        drain_on_ambiguous: { type: boolean }
        drain_on_soft_contention: { type: boolean }
        game_confirm_util_pct: { type: number }
        game_confirm_vram_mib: { type: integer }
    Schedule:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        profile: { type: string }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        start: { type: string, examples: ["07:00"] }
        end: { type: string, examples: ["17:00"] }
        enabled: { type: boolean }
    AppRule:
      type: object
      additionalProperties: false
      description: Exactly one of exe, path, path_prefix, glob must be set.
      required: [class]
      properties:
        name: { type: string }
        exe: { type: string }
        path: { type: string }
        path_prefix: { type: string }
        glob: { type: string }
        class: { $ref: "#/components/schemas/AppClass" }
    AntiThrashConfig:
      type: object
      additionalProperties: false
      properties:
        window: { $ref: "#/components/schemas/Duration" }
        max_preemptions: { type: integer }
        suppress_for: { $ref: "#/components/schemas/Duration" }
    RecoveryConfig:
      type: object
      additionalProperties: false
      properties:
        startup_cooldown: { $ref: "#/components/schemas/Duration" }
        resume_cooldown: { $ref: "#/components/schemas/Duration" }
        crash_backoff_initial: { $ref: "#/components/schemas/Duration" }
        crash_backoff_max: { $ref: "#/components/schemas/Duration" }
        telemetry_recovery_cooldown: { $ref: "#/components/schemas/Duration" }
        device_lost_cooldown: { $ref: "#/components/schemas/Duration" }
        crash_reset_after: { $ref: "#/components/schemas/Duration" }
    ModesConfig:
      type: object
      additionalProperties: false
      properties:
        pause_durations:
          type: array
          items: { $ref: "#/components/schemas/Duration" }
        ai_priority_durations:
          type: array
          items: { $ref: "#/components/schemas/Duration" }
        max_ai_priority: { $ref: "#/components/schemas/Duration" }
    SignalsConfig:
      type: object
      additionalProperties: false
      properties:
        session_stale_after: { $ref: "#/components/schemas/Duration" }
        process_interval: { $ref: "#/components/schemas/Duration" }
    SecurityConfig:
      type: object
      additionalProperties: false
      description: Token file references; token values never appear in the config.
      properties:
        loopback_trust: { type: boolean }
        management_token_file: { type: string }
        inference_token_file: { type: string }
        agent_token_file: { type: string }
        require_inference_token: { type: boolean }
    RetentionConfig:
      type: object
      additionalProperties: false
      properties:
        events_days: { type: integer }
        events_max: { type: integer }
        log_max_mb: { type: integer }
        log_files: { type: integer }
    MetricsConfig:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    LoggingConfig:
      type: object
      additionalProperties: false
      properties:
        level: { type: string, enum: [debug, info, warn, error] }
        dir: { type: string }
